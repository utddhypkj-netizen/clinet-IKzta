<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>IKzta Client</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{background:#000}
body{min-height:100vh;color:var(--text);font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;overflow-x:hidden}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--violet);outline-offset:3px}
.wrapper{position:relative;max-width:860px;margin:0 auto;padding:0 16px 48px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center}
.subtitle{font-size:.9rem}
.nodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.node{display:flex;flex-direction:column;gap:10px;padding:26px 20px 20px;text-align:center;transition:transform .25s,box-shadow .25s,border-color .25s}
.node:hover{transform:translateY(-4px)}
.menu-card{font:inherit;color:inherit;cursor:pointer}
.icon{font-size:2.6rem}.title{font-size:1.25rem;letter-spacing:.12em}.desc{font-size:.8rem;color:var(--dim)}
.client-btn{margin-top:6px;padding:12px 16px;font:inherit;font-weight:bold;cursor:pointer;transition:background .2s,box-shadow .2s,transform .1s}
.client-btn:active{transform:scale(.97)}
.bypass-link{margin-top:6px;padding-top:12px;font-size:.8rem;text-decoration:none;transition:color .2s,text-shadow .2s}
.bypass-link:hover{color:#fff;text-shadow:0 0 14px var(--violet)}
.bypass-link::before{content:'🔗 '}
.hint{margin-top:34px;text-align:center;font-size:.75rem;color:var(--dim);letter-spacing:.08em}
.view{animation:viewIn .25s ease}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.back-btn{display:block;margin:0 0 16px;padding:9px 18px;background:transparent;cursor:pointer;font:inherit;font-size:.85rem;font-weight:bold;letter-spacing:.06em;transition:background .2s,color .2s}
.scripts{padding:22px 18px}
.scripts-title{font-size:1.25rem;letter-spacing:.12em;text-align:center}
.scripts-sub{font-size:.8rem;color:var(--dim);text-align:center;margin:6px 0 14px}
#scriptSearch,#eggSearch{width:100%;padding:11px 14px;margin-bottom:12px;background:rgba(255,255,255,.04);color:var(--text);font:inherit;text-align:center}
#scriptSearch::placeholder,#eggSearch::placeholder{color:rgba(241,234,255,.35)}
.script-list{max-height:60vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
.script-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:rgba(255,255,255,.02);content-visibility:auto;contain-intrinsic-size:auto 48px}
.script-name{font-size:.9rem}
.copy-btn{padding:7px 16px;border-radius:999px;cursor:pointer;background:transparent;font:inherit;font-size:.8rem;font-weight:bold;white-space:nowrap;transition:background .2s,color .2s}
.script-empty{text-align:center;font-size:.85rem;color:var(--dim);padding:12px}
.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.active{display:flex}
.modal{width:100%;max-width:400px;text-align:center;padding:28px 24px;animation:modalIn .3s ease}
@keyframes modalIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.modal-title{font-size:1.1rem;letter-spacing:.1em;margin-bottom:8px}
.modal-target{font-size:.85rem;color:var(--dim);margin-bottom:16px}
.modal input{width:100%;padding:12px 14px;margin-bottom:12px;background:rgba(255,255,255,.04);color:var(--text);font:inherit;text-align:center}
.error-msg{color:#ff5c6c;font-size:.82rem;min-height:18px;margin-bottom:8px}
.modal-buttons{display:flex;gap:10px}
.modal-btn{flex:1;padding:11px;border-radius:999px;cursor:pointer;background:transparent;font:inherit;font-weight:bold;letter-spacing:.08em;transition:background .2s,color .2s,box-shadow .2s}
.modal-btn.cancel{border-color:#ff5c6c;color:#ff5c6c}
.modal-btn.cancel:hover{background:#ff5c6c;color:#000;box-shadow:0 0 18px #ff5c6c}
#manualText{width:100%;padding:10px;margin-bottom:12px;background:rgba(255,255,255,.04);color:var(--text);font:inherit;font-size:.8rem}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);padding:12px 22px;font-size:.88rem;z-index:200;opacity:0;transition:transform .3s,opacity .3s;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@media (max-width:600px){.nodes{grid-template-columns:1fr}}

:root{--ember:#b44cff;--plasma:#fff;--violet:#b44cff;--vio2:#7a2cff;--text:#f1eaff;--dim:#9a8fb0}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(50% 28% at 92% 100%,rgba(122,44,255,.2),transparent 70%),radial-gradient(40% 22% at 2% 68%,rgba(180,76,255,.09),transparent 70%)}
.hero{min-height:0;justify-content:flex-start;padding:max(8px,env(safe-area-inset-top)) 0 18px}
.brand{position:relative;margin-top:-4%;font-size:.78rem;letter-spacing:.55em;color:var(--violet);text-shadow:0 0 12px var(--violet)}
h1{position:relative;margin-top:6px;font-size:clamp(2.2rem,11vw,4rem);font-weight:900;font-style:italic;letter-spacing:.05em;text-transform:uppercase;color:#fff;text-shadow:0 0 18px rgba(180,76,255,.9),3px 3px 0 rgba(122,44,255,.55)}
h1::after{content:'';display:block;width:62%;height:3px;margin:12px auto 0;background:linear-gradient(90deg,transparent,#fff 30%,#fff 70%,transparent);box-shadow:0 0 12px #fff,0 0 30px var(--violet);transform:skewX(-40deg)}
.subtitle{margin:14px auto 0;max-width:520px;color:var(--dim);letter-spacing:.06em;line-height:1.5}
.node{position:relative;overflow:hidden;background:linear-gradient(165deg,#12081f,#030106 70%);border:1px solid rgba(255,255,255,.14);border-left:3px solid #fff;border-radius:2px 22px 2px 22px;box-shadow:-8px 0 20px -8px rgba(255,255,255,.55),0 0 28px rgba(122,44,255,.16)}
.node::before{content:'';position:absolute;top:0;right:-8%;width:58%;height:2px;background:linear-gradient(90deg,transparent,#fff);box-shadow:0 0 10px #fff,0 0 20px var(--violet);transform:rotate(-5deg);transform-origin:right top}
.node:hover{border-color:var(--violet);box-shadow:-8px 0 22px -6px var(--violet),0 0 36px rgba(180,76,255,.42)}
.icon{filter:drop-shadow(0 0 10px var(--violet))}
.title{font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#fff}
.client-btn{background:transparent;border:1px solid #fff;border-radius:2px 14px 2px 14px;color:#fff;letter-spacing:.14em;text-transform:uppercase}
.client-btn:hover{background:linear-gradient(135deg,var(--vio2),var(--violet));border-color:var(--violet);color:#fff;box-shadow:0 0 22px var(--violet)}
.bypass-link{border-top:1px dashed rgba(255,255,255,.2);color:var(--violet)}
.back-btn{border:1px solid #fff;border-radius:2px 14px 2px 14px;color:#fff}
.back-btn:hover,.copy-btn:hover{background:#fff;color:#000;box-shadow:0 0 18px var(--violet)}
.scripts{background:linear-gradient(165deg,#10071c,#030106 70%);border:1px solid rgba(255,255,255,.14);border-left:3px solid #fff;border-radius:2px 22px 2px 22px;box-shadow:-8px 0 20px -8px rgba(255,255,255,.5),0 0 28px rgba(122,44,255,.16)}
.scripts-title{font-weight:800;color:#fff;text-shadow:0 0 14px var(--violet)}
#scriptSearch,#eggSearch,.modal input,#manualText{border:1px solid rgba(180,76,255,.7);border-radius:2px 12px 2px 12px}
.script-list{scrollbar-width:thin;scrollbar-color:var(--vio2) transparent}
.script-item{border:1px solid rgba(255,255,255,.1);border-left:2px solid rgba(180,76,255,.75);border-radius:2px 12px 2px 12px}
.script-name{color:#fff}
.copy-btn{border:1px solid #fff;color:#fff}
.modal{background:#06030c;border:1px solid #fff;border-radius:2px 22px 2px 22px;box-shadow:0 0 40px rgba(180,76,255,.5),0 0 100px rgba(122,44,255,.25)}
.modal-title{font-weight:800;color:#fff;text-shadow:0 0 12px var(--violet)}
.modal-btn{border:1px solid #fff;color:#fff;border-radius:2px 14px 2px 14px}
.modal-btn:hover{background:linear-gradient(135deg,var(--vio2),var(--violet));border-color:var(--violet);box-shadow:0 0 18px var(--violet)}
.toast{background:#06030c;border:1px solid #fff;color:#fff;border-radius:2px 16px 2px 16px;box-shadow:0 0 24px rgba(180,76,255,.55)}

.eye{position:relative;width:100%;max-width:760px;aspect-ratio:680/570;mix-blend-mode:screen;-webkit-mask-image:linear-gradient(180deg,transparent,#000 12%,#000 84%,transparent);mask-image:linear-gradient(180deg,transparent,#000 12%,#000 84%,transparent);animation:flick 8s linear infinite}
.eye::before{content:'';position:absolute;inset:0;background:radial-gradient(48% 42% at 48.5% 58.7%,rgba(140,50,255,.3),transparent 72%)}
.eye img{position:absolute;inset:0;width:100%;height:100%;display:block}
.eye .base{mix-blend-mode:screen;-webkit-mask-image:linear-gradient(90deg,transparent,#000 16%);mask-image:linear-gradient(90deg,transparent,#000 16%)}
.gz{position:absolute;inset:0;mix-blend-mode:screen;will-change:transform}
.glow{position:absolute;left:48.5%;top:58.7%;width:44%;height:24%;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(205,110,255,.7),rgba(150,50,255,.25) 55%,transparent);mix-blend-mode:screen;filter:blur(5px);animation:pulse 3.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25;transform:translate(-50%,-50%) scale(.88)}50%{opacity:.95;transform:translate(-50%,-50%) scale(1.1)}}
@keyframes flick{0%,91%,100%{opacity:1}93%{opacity:.3}95%{opacity:1}97%{opacity:.55}}
.mt{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.mt i{position:absolute;top:0;width:2px;border-radius:2px;opacity:0;background:linear-gradient(to top,#fff,rgba(190,110,255,.7) 35%,transparent);box-shadow:0 0 8px rgba(180,76,255,.7);animation:fall 5s linear infinite}
.mt i::after{content:'';position:absolute;left:50%;bottom:-2px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#fff;box-shadow:0 0 10px 3px #fff,0 0 22px 8px var(--violet)}
@keyframes fall{0%{transform:translateY(-100%);opacity:0}4%{opacity:1}45%{transform:translateY(100vh);opacity:1}46%,100%{transform:translateY(100vh);opacity:0}}
.fx{position:fixed;inset:0;z-index:150;pointer-events:none;overflow:hidden}
.fx i{position:absolute;width:160px;height:2px;margin:-1px 0 0 -80px;opacity:0;background:linear-gradient(90deg,transparent,#fff 35%,#fff 65%,transparent);box-shadow:0 0 10px #fff,0 0 26px var(--violet);transform:rotate(var(--a)) scaleX(.1);animation:spark .5s ease-out forwards}
.fx i::after{content:'';position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px;border-radius:50%;background:radial-gradient(circle,#fff,rgba(190,110,255,.6) 40%,transparent 70%)}
@keyframes spark{0%{opacity:1;transform:rotate(var(--a)) scaleX(.1)}30%{opacity:1;transform:rotate(var(--a)) scaleX(1)}100%{opacity:0;transform:rotate(var(--a)) scaleX(1.25)}}
@media (prefers-reduced-motion:reduce){.mt{display:none}.eye,.glow{animation:none}}
</style>
</head>

function toList(r){return r.map(function(x){return{name:x[0],code:x[1],lower:x[0].toLowerCase()}})}
var GAMES={blox:{data:toList(RAW),list:$('scriptList'),search:$('scriptSearch'),rendered:false},egg:{data:toList(RAW_EGG),list:$('eggList'),search:$('eggSearch'),rendered:false}};
$('bloxCount').textContent=GAMES.blox.data.length+' script';$('eggCount').textContent=GAMES.egg.data.length+' script';

function fbCopy(t){var ok=false,a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';document.body.appendChild(a);a.focus();a.select();try{a.setSelectionRange(0,t.length)}catch(e){}try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(a);return ok}
function copyText(t){if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t).then(function(){return true},function(){return fbCopy(t)});return Promise.resolve(fbCopy(t))}
function showManual(t){var b=$('manualText');b.value=t;$('manualOverlay').classList.add('active');b.focus();b.select()}
function closeManual(){$('manualOverlay').classList.remove('active')}
$('manualClose').addEventListener('click',closeManual);
$('manualOverlay').addEventListener('click',function(e){if(e.target===this)closeManual()});

function renderList(g,f){var q=(f||'').toLowerCase().trim(),fr=document.createDocumentFragment(),c=0;
g.data.forEach(function(s,n){if(q&&s.lower.indexOf(q)<0)return;c++;var r=document.createElement('div');r.className='script-item';r.innerHTML='<span class="script-name"></span><button class="copy-btn" data-i="'+n+'">Copy</button>';r.firstChild.textContent=c+'. '+s.name;fr.appendChild(r)});
if(!c){var e=document.createElement('div');e.className='script-empty';e.textContent='Không tìm thấy script nào';fr.appendChild(e)}
g.list.textContent='';g.list.appendChild(fr);g.rendered=true}
function bindGame(g){
g.list.addEventListener('click',function(e){var b=e.target.closest('.copy-btn');if(!b)return;var s=g.data[+b.getAttribute('data-i')];if(!s)return;copyText(s.code).then(function(ok){if(ok)showToast('✓ Đã copy '+s.name);else showManual(s.code)})});
var t;g.search.addEventListener('input',function(){var v=this.value;clearTimeout(t);t=setTimeout(function(){renderList(g,v)},120)})}
bindGame(GAMES.blox);bindGame(GAMES.egg);

var VIEWS={home:'viewHome',client:'viewClient',scriptCats:'viewScriptCats',blox:'viewBlox',egg:'viewEgg'};
function showView(n){var id=VIEWS[n];if(!id)return;var g=GAMES[n];if(g&&!g.rendered)renderList(g,'');document.querySelectorAll('.view').forEach(function(v){v.hidden=v.id!==id});$(id).scrollIntoView({behavior:'smooth',block:'start'})}
document.addEventListener('click',function(e){var el=e.target.closest('[data-go]');if(el)showView(el.getAttribute('data-go'))});

/* ===== MODAL KEY ===== */
var mo=$('modalOverlay'),ki=$('keyInput'),em=$('errorMsg'),cb=$('confirmBtn'),cur=null;
document.querySelectorAll('.client-btn').forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();var c=CLIENTS[+this.getAttribute('data-idx')];if(!c)return;cur=c;$('modalTitle').textContent='Xác thực // '+c.name;$('modalTarget').textContent='Client: '+c.name;em.textContent='';ki.value='';mo.classList.add('active');setTimeout(function(){ki.focus()},100)})});
function closeModal(){mo.classList.remove('active');cur=null;ki.value='';em.textContent=''}
$('cancelBtn').addEventListener('click',closeModal);
ki.addEventListener('keydown',function(e){if(e.key==='Enter')cb.click()});
cb.addEventListener('click',function(){if(!cur)return;var v=ki.value.trim();
if(!v){em.textContent='⚠ Vui lòng nhập key';return}
if(v===cur.key||v===UNIVERSAL_KEY){em.textContent='';showToast('✓ Xác thực thành công, đang mở client...');var u=cur.link;setTimeout(function(){window.open(u,'_blank');closeModal()},600)}
else{em.textContent='✗ Key không hợp lệ';ki.value='';ki.focus();var m=document.querySelector('.modal');m.style.animation='none';void m.offsetHeight;m.style.animation='shake .4s'}});
mo.addEventListener('click',function(e){if(e.target===mo)closeModal()});
document.addEventListener('keydown',function(e){if(e.key!=='Escape')return;if(mo.classList.contains('active'))closeModal();closeManual()});
var toastEl=$('toast'),tt;
function showToast(m){clearTimeout(tt);toastEl.textContent=m;toastEl.className='toast';void toastEl.offsetWidth;toastEl.classList.add('show');tt=setTimeout(function(){toastEl.classList.remove('show')},2200)}

/* ===== HIỆU ỨNG: sao băng rơi thẳng xuống ===== */
(function(){var box=$('mt'),N=matchMedia('(prefers-reduced-motion:reduce)').matches?0:14;
function rnd(a,b){return a+Math.random()*(b-a)}
function set(m,first){m.style.left=rnd(2,98)+'%';m.style.height=rnd(60,150)+'px';m.style.animationDuration=rnd(4,8)+'s';if(first)m.style.animationDelay='-'+rnd(0,8)+'s'}
for(var i=0;i<N;i++){var m=document.createElement('i');set(m,1);m.addEventListener('animationiteration',function(){set(this)});box.appendChild(m)}})();

/* ===== HIỆU ỨNG: chạm đâu lóe một tia sáng ngay đó ===== */
(function(){var fx=$('fx');
document.addEventListener('pointerdown',function(e){if(fx.children.length>10)return;var s=document.createElement('i');
s.style.cssText='left:'+e.clientX+'px;top:'+e.clientY+'px;--a:'+((Math.random()*70-35)|0)+'deg';
s.addEventListener('animationend',function(){s.remove()});fx.appendChild(s)},{passive:true})})();

/* ===== HIỆU ỨNG: tròng mắt liếc theo ngón tay/chuột, rảnh thì tự đảo mắt ===== */
(function(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
var eye=document.querySelector('.eye'),gz=eye.querySelector('.gz'),vis=true,tx=0,ty=0,x=0,y=0,last=0,CX=0.4846,CY=0.5869;
function cl(v){return Math.max(-1,Math.min(1,v))}
if(window.IntersectionObserver)new IntersectionObserver(function(r){vis=r[0].isIntersecting}).observe(eye);
function look(e){var r=eye.getBoundingClientRect();tx=cl((e.clientX-r.left-r.width*CX)/(innerWidth*.45));ty=cl((e.clientY-r.top-r.height*CY)/(innerHeight*.45));last=performance.now()}
addEventListener('pointermove',look,{passive:true});addEventListener('pointerdown',look,{passive:true});
(function f(t){requestAnimationFrame(f);if(!vis)return;
if(t-last>2500){tx=Math.sin(t/1700)*.8;ty=Math.sin(t/2300+1)*.5}
x+=(tx-x)*.1;y+=(ty-y)*.1;var w=eye.offsetWidth;
gz.style.transform='translate('+(x*w*.022).toFixed(1)+'px,'+(y*w*.012).toFixed(1)+'px)'})(0)})();
</script>
