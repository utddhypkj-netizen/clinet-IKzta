<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IKzta Client</title>
<style>
:root{
    --void:#000;
    --ember:#ffb054;
    --plasma:#ffe0b0;
    --violet:#8a6cff;
    --text:#f4ece4;
    --dim:#a89a90;
}
*{margin:0;padding:0;box-sizing:border-box}
html{background:#000}
body{
    min-height:100vh;
    background:#000;
    color:var(--text);
    font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;
    overflow-x:hidden;
}
#hole{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.vignette{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse at 50% 30%,transparent 35%,rgba(0,0,0,.75) 100%);
}
.wrapper{
    position:relative;z-index:10;
    max-width:860px;margin:0 auto;
    padding:0 16px 48px;
}
.hero{
    min-height:62vh;
    display:flex;flex-direction:column;
    align-items:center;justify-content:flex-end;
    text-align:center;padding-bottom:28px;
}
.brand{
    font-size:.8rem;letter-spacing:.45em;
    color:var(--ember);margin-bottom:10px;
}
h1{
    font-size:clamp(2rem,8vw,3.6rem);
    font-weight:300;letter-spacing:.16em;
    color:var(--plasma);
    text-shadow:0 0 24px rgba(255,138,61,.6),0 0 60px rgba(138,108,255,.35);
}
.subtitle{
    margin-top:12px;font-size:.9rem;
    color:var(--dim);letter-spacing:.08em;
}
.nodes{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:20px;
}
.node{
    background:rgba(6,3,12,.78);
    border:1px solid rgba(255,138,61,.35);
    border-radius:18px;
    padding:26px 20px 20px;
    text-align:center;
    display:flex;flex-direction:column;gap:10px;
    backdrop-filter:blur(6px);
    box-shadow:0 0 22px rgba(138,108,255,.15),inset 0 0 24px rgba(255,138,61,.05);
    transition:transform .25s,box-shadow .25s,border-color .25s;
}
.node:hover{
    transform:translateY(-4px);
    border-color:var(--ember);
    box-shadow:0 0 34px rgba(255,138,61,.45),inset 0 0 28px rgba(255,138,61,.12);
}
.icon{font-size:2.6rem;filter:drop-shadow(0 0 10px var(--ember))}
.title{font-size:1.25rem;letter-spacing:.12em;color:var(--plasma)}
.desc{font-size:.8rem;color:var(--dim)}
.client-btn{
    margin-top:6px;padding:12px 16px;
    background:linear-gradient(135deg,rgba(255,138,61,.18),rgba(138,108,255,.18));
    border:1px solid var(--ember);
    color:var(--plasma);
    font:inherit;font-weight:bold;letter-spacing:.1em;
    border-radius:999px;cursor:pointer;
    transition:background .2s,box-shadow .2s,transform .1s;
}
.client-btn:hover{background:var(--ember);color:#000;box-shadow:0 0 24px var(--ember)}
.client-btn:active{transform:scale(.97)}
.client-btn:focus-visible,.modal-btn:focus-visible,.bypass-link:focus-visible,.modal input:focus-visible{
    outline:2px solid var(--violet);outline-offset:3px;
}
.bypass-link{
    margin-top:6px;padding-top:12px;
    border-top:1px dashed rgba(255,138,61,.3);
    font-size:.8rem;color:var(--violet);text-decoration:none;
    transition:color .2s,text-shadow .2s;
}
.bypass-link:hover{color:#fff;text-shadow:0 0 14px var(--violet)}
.bypass-link::before{content:'🔗 '}
.hint{margin-top:34px;text-align:center;font-size:.75rem;color:var(--dim);letter-spacing:.08em}

.modal-overlay{
    position:fixed;inset:0;z-index:100;
    background:rgba(0,0,0,.88);backdrop-filter:blur(6px);
    display:none;align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.active{display:flex}
.modal{
    width:100%;max-width:400px;text-align:center;
    background:#05030a;
    border:1px solid var(--ember);border-radius:20px;
    padding:28px 24px;
    box-shadow:0 0 50px rgba(255,138,61,.45),0 0 120px rgba(138,108,255,.25);
    animation:modalIn .3s ease;
}
@keyframes modalIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.modal-title{font-size:1.1rem;letter-spacing:.1em;color:var(--plasma);margin-bottom:8px}
.modal-target{font-size:.85rem;color:var(--dim);margin-bottom:16px}
.modal input{
    width:100%;padding:12px 14px;margin-bottom:12px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,138,61,.6);border-radius:10px;
    color:var(--text);font:inherit;text-align:center;
}
.modal input::placeholder{color:rgba(244,236,228,.35)}
.error-msg{color:#ff5c6c;font-size:.82rem;min-height:18px;margin-bottom:8px}
.modal-buttons{display:flex;gap:10px}
.modal-btn{
    flex:1;padding:11px;border-radius:999px;cursor:pointer;
    background:transparent;border:1px solid var(--ember);color:var(--plasma);
    font:inherit;font-weight:bold;letter-spacing:.08em;
    transition:background .2s,color .2s,box-shadow .2s;
}
.modal-btn:hover{background:var(--ember);color:#000;box-shadow:0 0 18px var(--ember)}
.modal-btn.cancel{border-color:#ff5c6c;color:#ff5c6c}
.modal-btn.cancel:hover{background:#ff5c6c;color:#000;box-shadow:0 0 18px #ff5c6c}

.toast{
    position:fixed;bottom:24px;left:50%;
    transform:translateX(-50%) translateY(100px);
    background:#05030a;border:1px solid var(--ember);color:var(--plasma);
    padding:12px 22px;border-radius:999px;font-size:.88rem;
    z-index:200;opacity:0;transition:all .3s;max-width:90vw;text-align:center;
    box-shadow:0 0 24px rgba(255,138,61,.5);
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@media (max-width:600px){.nodes{grid-template-columns:1fr}}
</style>
</head>
<body>

<canvas id="hole"></canvas>
<div class="vignette"></div>

<div class="wrapper">
    <header class="hero">
        <div class="brand">IKZTA SYSTEM</div>
        <h1>IKzta Client</h1>
        <p class="subtitle">vượt link nhận key lấy clinet của IKzta cảm ơn nhiều clinet roblox
    </p>
    </header>

    <main class="nodes" id="nodesContainer"></main>

    <p class="hint">Cần key để mở client</p>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <div class="modal-title" id="modalTitle">Xác thực key</div>
        <div class="modal-target" id="modalTarget">Client: ---</div>
        <div class="error-msg" id="errorMsg"></div>
        <input type="text" id="keyInput" placeholder="Nhập key truy cập..." autocomplete="off">
        <div class="modal-buttons">
            <button class="modal-btn cancel" id="cancelBtn">Hủy</button>
            <button class="modal-btn" id="confirmBtn">Xác nhận</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CẤU HÌNH CLIENT - IKZTA
   ============================================================ */
var CLIENTS = [
    {
        name: 'Delta iOS',
        icon: '🍎',
        desc: 'Delta Client cho iOS',
        link:   'https://www.mediafire.com/file/xfe4swbggsdi3lt/Delta-2.741.1062.ipa/file',
        key:    'ikzta:sieu:cap:vop:pro:max:heheios',
        bypass: 'https://link4m.net/qKrMkpu'
    },
    {
        name: 'DELTA Android',
        icon: '🤖',
        desc: 'Delta Executor cho Android',
        link:   'https://www.mediafire.com/file/8a8a2u8s1a45u31/Delta-2.741.1062.apk/file',
        key:    'IKzta-$$clientSieeuvip-android',
        bypass: 'https://link4m.net/yRhiZwH'
    },
    {
        name: 'Code X',
        icon: '💻',
        desc: 'Client cho Code X',
        link:   'https://codex.lol/android',
        key:    'ikzta:code:sieu:aura',
        bypass: 'https://link4m.net/Nva2pS'
    }
];

/* KEY VẠN NĂNG - dùng được cho TẤT CẢ client */
var UNIVERSAL_KEY = 'KeyvannangIKztachungthuong!!!@@@';

/* ============================================================
   RENDER CLIENT
   ============================================================ */
var nodesContainer = document.getElementById('nodesContainer');

for (var i = 0; i < CLIENTS.length; i++) {
    var client = CLIENTS[i];
    var node = document.createElement('div');
    node.className = 'node';
    node.innerHTML =
        '<span class="icon">' + client.icon + '</span>' +
        '<div class="title">' + client.name + '</div>' +
        '<div class="desc">' + client.desc + '</div>' +
        '<button class="client-btn" data-idx="' + i + '">🔒 Mở client</button>' +
        '<a class="bypass-link" href="' + client.bypass + '" target="_blank" rel="noopener">Lấy key tại đây</a>';
    nodesContainer.appendChild(node);
}

/* ============================================================
   HỐ ĐEN - đĩa bồi tụ nghiêng, ánh sáng uốn cong, sáng lệch về bên phải
   ============================================================ */
var canvas = document.getElementById('hole');
var ctx = canvas.getContext('2d');
var W, H, cx, cy, R, particles = [], stars = [];
var TILT = 0.3, ROT = -0.16, COS = Math.cos(ROT), SIN = Math.sin(ROT);
var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var speedScale = reduceMotion ? 0.15 : 1;

function spawn(p, anywhere) {
    p.a = Math.random() * Math.PI * 2;
    p.r = anywhere ? R * (1.15 + Math.pow(Math.random(), 1.5) * 5) : R * (5.2 + Math.random() * 0.8);
    p.s = 0.7 + Math.random() * 0.6;
    return p;
}

function initHole() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2; cy = H * 0.3;
    R = Math.min(W, H) * 0.085;
    var n = Math.min(1100, Math.floor(W * H / 1500));
    particles = [];
    for (var i = 0; i < n; i++) particles.push(spawn({}, true));
    stars = [];
    for (var k = 0; k < 110; k++) stars.push({x: Math.random() * W, y: Math.random() * H, o: Math.random() * 0.55 + 0.15});
}

function proj(r, a) {
    var lx = r * Math.cos(a), ly = r * Math.sin(a) * TILT;
    return [cx + lx * COS - ly * SIN, cy + lx * SIN + ly * COS];
}
function omega(p) { return 0.05 * Math.pow(R / p.r, 1.5) * p.s * speedScale; }
function beam(a) { var b = 0.5 + 0.5 * Math.cos(a + 0.25); return b * b; } // sáng nhất ở bên phải

function drawDisk(p, front) {
    if ((Math.sin(p.a) > 0) !== front) return;
    var a0 = p.a - omega(p) * 7;
    var A = proj(p.r, a0), B = proj(p.r, p.a);
    var heat = Math.max(0, 1 - (p.r - R) / (R * 5));
    var br = 0.15 + beam(p.a) * 0.85;
    ctx.strokeStyle = 'hsla(' + (26 + heat * 22) + ',100%,' + (45 + heat * 25 + br * 20) + '%,' + (0.12 + br * 0.6 * (0.4 + heat * 0.6)) + ')';
    ctx.lineWidth = 0.7 + heat * 1.3;
    ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.stroke();
}

// Ảnh phía sau đĩa bị uốn cong vòng lên trên hố đen
function drawLens(p) {
    var s = Math.sin(p.a);
    if (s >= 0) return;
    var Rk = R * (1.04 + (p.r - R) / R * 0.06);
    var b0 = p.a - omega(p) * 7;
    var br = 0.15 + beam(p.a) * 0.85;
    ctx.strokeStyle = 'rgba(255,205,130,' + (0.18 + br * 0.5) + ')';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(b0) * Rk, cy - Math.abs(Math.sin(b0)) * Rk * 0.98);
    ctx.lineTo(cx + Math.cos(p.a) * Rk, cy - Math.abs(s) * Rk * 0.98);
    ctx.stroke();
}

function frame(t) {
    var i, k, g;
    for (i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.a += omega(p);
        p.r -= 0.02 * speedScale * (R / p.r);
        if (p.r < R * 1.12) spawn(p, false);
    }

    ctx.globalCompositeOperation = 'source-over';
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    for (k = 0; k < stars.length; k++) {
        ctx.fillStyle = 'rgba(255,255,255,' + stars[k].o + ')';
        ctx.fillRect(stars[k].x, stars[k].y, 1, 1);
    }

    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';

    // Quầng sáng mờ ở xa
    ctx.strokeStyle = 'rgba(150,170,255,0.10)';
    ctx.lineWidth = R * 0.14;
    ctx.beginPath(); ctx.arc(cx, cy, R * 6.2, 0, Math.PI * 2); ctx.stroke();

    // Đám khí cam trôi ở bên trái
    for (k = 0; k < 4; k++) {
        var gx = cx - R * (2 + k * 1.3) + Math.sin(t / 3000 + k) * R * 0.2;
        var gy = cy + Math.sin(k * 2) * R * 0.25;
        g = ctx.createRadialGradient(gx, gy, 0, gx, gy, R * 1.6);
        g.addColorStop(0, 'rgba(255,150,60,0.10)');
        g.addColorStop(1, 'rgba(255,150,60,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(gx, gy, R * 1.6, 0, Math.PI * 2); ctx.fill();
    }

    // Nửa sau của đĩa + ảnh uốn cong
    for (i = 0; i < particles.length; i++) { drawDisk(particles[i], false); drawLens(particles[i]); }

    // Chân trời sự kiện
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,225,170,0.55)';
    ctx.lineWidth = 1.5;
    ctx.shadowColor = '#ffa850'; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
    ctx.shadowBlur = 0;

    // Nửa trước của đĩa che ngang phần dưới hố đen
    ctx.globalCompositeOperation = 'lighter';
    for (i = 0; i < particles.length; i++) drawDisk(particles[i], true);

    // Điểm sáng chói bên phải (hiệu ứng Doppler)
    var hx = cx + R * 1.5, hy = cy + R * 0.35;
    g = ctx.createRadialGradient(hx, hy, 0, hx, hy, R * 2.4);
    g.addColorStop(0, 'rgba(255,245,225,0.75)');
    g.addColorStop(0.25, 'rgba(255,190,100,0.4)');
    g.addColorStop(1, 'rgba(255,150,60,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(hx, hy, R * 2.4, 0, Math.PI * 2); ctx.fill();

    // Vệt sáng ngang
    var fx = cx - W * 0.35, fw = W * 1.35;
    var lg = ctx.createLinearGradient(fx, 0, fx + fw, 0);
    lg.addColorStop(0, 'rgba(255,200,120,0)');
    lg.addColorStop(0.5, 'rgba(255,200,120,0.5)');
    lg.addColorStop(0.62, 'rgba(255,240,210,0.9)');
    lg.addColorStop(1, 'rgba(255,200,120,0)');
    ctx.fillStyle = lg;
    ctx.shadowColor = '#ffb054'; ctx.shadowBlur = 12;
    ctx.fillRect(fx, cy + R * 0.3 - 1, fw, 2);
    ctx.shadowBlur = 0;

    requestAnimationFrame(frame);
}
initHole();
requestAnimationFrame(frame);
window.addEventListener('resize', initHole);

/* ============================================================
   MODAL LOGIC
   ============================================================ */
var modalOverlay = document.getElementById('modalOverlay');
var modalTitle = document.getElementById('modalTitle');
var modalTarget = document.getElementById('modalTarget');
var keyInput = document.getElementById('keyInput');
var errorMsg = document.getElementById('errorMsg');
var confirmBtn = document.getElementById('confirmBtn');
var cancelBtn = document.getElementById('cancelBtn');
var toast = document.getElementById('toast');

var currentClient = null;

var allBtns = document.querySelectorAll('.client-btn');
for (var j = 0; j < allBtns.length; j++) {
    allBtns[j].addEventListener('click', function (e) {
        e.stopPropagation();
        var idx = parseInt(this.getAttribute('data-idx'), 10);
        var client = CLIENTS[idx];
        if (!client) return;

        currentClient = client;
        modalTitle.textContent = 'Xác thực // ' + client.name;
        modalTarget.textContent = 'Client: ' + client.name;
        errorMsg.textContent = '';
        keyInput.value = '';

        modalOverlay.classList.add('active');
        setTimeout(function () { keyInput.focus(); }, 100);
    });
}

function closeModal() {
    modalOverlay.classList.remove('active');
    currentClient = null;
    keyInput.value = '';
    errorMsg.textContent = '';
}

cancelBtn.addEventListener('click', closeModal);

keyInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') confirmBtn.click();
});

confirmBtn.addEventListener('click', function () {
    if (!currentClient) return;
    var entered = keyInput.value.trim();

    if (entered === '') {
        errorMsg.textContent = '⚠ Vui lòng nhập key';
        return;
    }

    if (entered === currentClient.key || entered === UNIVERSAL_KEY) {
        errorMsg.textContent = '';
        showToast('✓ Xác thực thành công, đang mở client...');
        var targetUrl = currentClient.link;
        setTimeout(function () {
            window.open(targetUrl, '_blank');
            closeModal();
        }, 600);
    } else {
        errorMsg.textContent = '✗ Key không hợp lệ';
        keyInput.value = '';
        keyInput.focus();
        var modal = document.querySelector('.modal');
        modal.style.animation = 'none';
        void modal.offsetHeight;
        modal.style.animation = 'shake 0.4s';
    }
});

modalOverlay.addEventListener('click', function (e) {
    if (e.target === modalOverlay) closeModal();
});

document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && modalOverlay.classList.contains('active')) closeModal();
});

/* ============================================================
   TOAST
   ============================================================ */
var toastTimer;
function showToast(msg) {
    clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.className = 'toast';
    void toast.offsetWidth;
    toast.classList.add('show');
    toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2200);
}
</script>
</body>
</html>
